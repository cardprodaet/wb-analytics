name: WB Analytics Daily Update

on:
  schedule:
    - cron: '0 23 * * *'  # 23:00 UTC = 02:00 МСК
  workflow_dispatch:       # ручной запуск из GitHub UI

jobs:
  update-all:
    runs-on: ubuntu-latest
    timeout-minutes: 420  # старт 23:00 UTC + 420 мин = макс 06:00 UTC = 09:00 МСК

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Create credentials file
      run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

    - name: Part 1 — Funnel, Stocks, Sales, Orders
      run: python main1.py

    - name: Part 2 — RK periods, Funnel periods
      run: python main2.py

    - name: Part 3 — Funnel periods (standalone)
      run: python main3.py

    - name: Remove credentials file
      if: always()
      run: rm -f credentials.json

    - name: Telegram — успех
      if: success()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          --data-urlencode "text=✅ WB Analytics — обновление прошло успешно"

    - name: Telegram — сбой
      if: failure()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          --data-urlencode "text=❌ WB Analytics — обновление УПАЛО. Логи: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
